name: Test VPN client

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/security-check.sh

  test:
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build ./cmd/vpnctl
